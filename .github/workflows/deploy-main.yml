name: Deploy — Production (main)

on:
  push:
    branches:
      - main

jobs:
  deploy-production:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FUNCTIONS_REGION: asia-east1

    steps:
      - uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
              - 'main.py'
              - 'pyproject.toml'
              - 'uv.lock'

      # ── Frontend Build ──────────────────────────────────────────────────
      - name: Setup pnpm
        if: steps.filter.outputs.frontend == 'true'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        if: steps.filter.outputs.frontend == 'true'
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        if: steps.filter.outputs.frontend == 'true'
        run: pnpm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://asia-east1-anti-harassment-bot.cloudfunctions.net/api

      # ── Firebase Deploy ─────────────────────────────────────────────────
      - name: Install Firebase CLI
        if: steps.filter.outputs.frontend == 'true' || steps.filter.outputs.backend == 'true'
        run: npm install -g firebase-tools

      - name: Install uv
        if: steps.filter.outputs.backend == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Python environment for Firebase CLI
        if: steps.filter.outputs.backend == 'true'
        run: |
          uv export --format requirements-txt > requirements.txt
          uv venv venv
          uv pip install -r requirements.txt -p venv

      - name: Write Firebase service account
        if: steps.filter.outputs.backend == 'true'
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > firebase_admin.json

      - name: Write backend .env
        if: steps.filter.outputs.backend == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          RUNTIME_CONFIG_DOCUMENT_ID: app_main
          ENVIRONMENT: production
        run: |
          python - <<'PY'
          import json
          import os

          keys = [
              "OPENROUTER_API_KEY",
              "ADMIN_API_KEY",
              "RUNTIME_CONFIG_DOCUMENT_ID",
              "ENVIRONMENT",
          ]
          with open(".env", "w", encoding="utf-8") as env_file:
              for key in keys:
                  value = os.environ.get(key, "")
                  env_file.write(f"{key}={json.dumps(value, ensure_ascii=False)}\n")
          PY

      - name: Deploy to Firebase Hosting (production)
        id: firebase-hosting-deploy
        if: steps.filter.outputs.frontend == 'true'
        run: |
          set -e
          if ! firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive --force > deploy.log 2>&1; then
            cat deploy.log
            echo "Firebase hosting deployment failed."
            exit 1
          fi
          cat deploy.log
          DEPLOY_URL=$(grep -oP 'Hosting URL: \K.*' deploy.log | head -1 || echo "https://anti-harassment-bot.web.app")
          echo "deploy_url=${DEPLOY_URL}" >> $GITHUB_OUTPUT

      - name: Deploy Functions (api production)
        if: steps.filter.outputs.backend == 'true'
        run: |
          set -e
          if ! firebase deploy --only functions:api:api --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive --force > deploy.log 2>&1; then
            cat deploy.log
            echo "Firebase functions deployment failed."
            exit 1
          fi
          cat deploy.log
