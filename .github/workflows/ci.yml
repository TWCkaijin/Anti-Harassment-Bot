name: CI — Lint, Test & Build

on:
  push:
    branches-ignore: [dev, main]
  pull_request:
    branches: ["**"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ci-placeholder-not-a-real-key
      ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install Python and all application dependencies
        run: |
          uv python install 3.13
          uv sync --frozen --all-extras
      - name: Lint and format check
        run: |
          uv run ruff check client/backend admin/backend shared/python client/tests admin/tests shared/tests scripts conftest.py
          uv run ruff format --check client/backend admin/backend shared/python client/tests admin/tests shared/tests scripts conftest.py
      - name: Test client, admin, and shared backends
        run: uv run pytest client/tests admin/tests shared/tests -q --tb=short
      - name: Verify independent function source packages
        run: |
          uv run python scripts/build_functions.py --discovery-venv
          uv run python scripts/quality/check_source_package.py

  frontend:
    name: Shared, client, and admin frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install complete workspace
        run: pnpm install --frozen-lockfile
      - name: Lint shared and both frontends
        run: pnpm -r lint
      - name: Run frontend regressions
        run: pnpm -r test
      - name: Build shared package then both frontends
        run: |
          pnpm --filter @rag/shared build
          pnpm --filter @rag/client build
          pnpm --filter @rag/admin build
      - name: Verify preview-only masking entry
        run: pnpm --filter @rag/admin exec vite build --mode preview --outDir dist-preview

  firestore-rules:
    name: Firestore Rules Emulator (four databases)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned emulator test tools
        run: |
          pnpm install --frozen-lockfile
          npm install --global firebase-tools@15.33.0
      - name: Verify anonymous and Firebase Auth denial on all four databases
        env:
          FIREBASE_EMULATORS_PATH: ${{ runner.temp }}/firebase-emulators
        run: pnpm test:rules
