name: CI — Lint & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Python Backend ──────────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Run ruff check
        id: ruff-check
        run: uv run ruff check backend/ tests/
        continue-on-error: true

      - name: Run ruff format check
        id: ruff-format
        run: uv run ruff format --check backend/ tests/
        continue-on-error: true

      - name: Attempt backend auto-fix
        if: steps.ruff-check.outcome == 'failure' || steps.ruff-format.outcome == 'failure'
        run: |
          uv run ruff check --fix backend/ tests/ || true
          uv run ruff format backend/ tests/

      - name: Verify backend fixes
        id: verify-backend
        if: steps.ruff-check.outcome == 'failure' || steps.ruff-format.outcome == 'failure'
        run: |
          uv run ruff check backend/ tests/
          uv run ruff format --check backend/ tests/

      - name: Create Pull Request for Backend Fixes
        if: (steps.ruff-check.outcome == 'failure' || steps.ruff-format.outcome == 'failure') && success()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "style: auto-fix backend lint/format issues"
          title: "style: auto-fix backend lint/format issues"
          body: "This PR contains automatic backend lint and formatting fixes generated by the CI workflow."
          branch: "auto-fix-backend-lint-${{ github.head_ref || github.ref_name }}"
          base: ${{ github.head_ref || github.ref_name }}

      - name: Fail job to prevent merging unfixed code
        if: steps.ruff-check.outcome == 'failure' || steps.ruff-format.outcome == 'failure'
        run: |
          echo "Lint/formatting errors were found but successfully auto-fixed. A PR has been created to resolve these."
          echo "Failing this run to block merge of the unfixed code."
          exit 1

  backend-test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    needs: backend-lint
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Run pytest
        run: uv run pytest tests/ -v --tb=short

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Run ESLint
        id: eslint
        run: pnpm run lint
        working-directory: frontend
        continue-on-error: true

      - name: Attempt ESLint fix
        if: steps.eslint.outcome == 'failure'
        run: pnpm run lint --fix
        working-directory: frontend
        continue-on-error: true

      - name: Verify ESLint fixes
        id: verify-frontend
        if: steps.eslint.outcome == 'failure'
        run: pnpm run lint
        working-directory: frontend

      - name: Create Pull Request for Frontend Fixes
        if: steps.eslint.outcome == 'failure' && success()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "style: auto-fix frontend lint issues"
          title: "style: auto-fix frontend lint issues"
          body: "This PR contains automatic frontend lint fixes generated by the CI workflow."
          branch: "auto-fix-frontend-lint-${{ github.head_ref || github.ref_name }}"
          base: ${{ github.head_ref || github.ref_name }}

      - name: Fail job to prevent merging unfixed code
        if: steps.eslint.outcome == 'failure'
        run: |
          echo "Lint errors were found but successfully auto-fixed. A PR has been created to resolve these."
          echo "Failing this run to block merge of the unfixed code."
          exit 1

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build
        run: pnpm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://asia-east1-anti-harassment-bot.cloudfunctions.net/api' }}
