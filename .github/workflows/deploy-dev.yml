name: Deploy — Preview (dev)

on:
  push:
    branches:
      - dev

jobs:
  deploy-preview:
    name: Build & Deploy to Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      FIREBASE_PROJECT_ID: anti-harassment-bot
      FUNCTIONS_REGION: asia-east1
      PREVIEW_CHANNEL: dev-preview

    steps:
      - uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
              - 'main.py'
              - 'pyproject.toml'
              - 'uv.lock'

      # ── Frontend Build ──────────────────────────────────────────────────
      - name: Setup pnpm
        if: steps.filter.outputs.frontend == 'true'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        if: steps.filter.outputs.frontend == 'true'
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend (preview)
        if: steps.filter.outputs.frontend == 'true'
        run: pnpm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://asia-east1-anti-harassment-bot.cloudfunctions.net/api_preview
          VITE_ENV: preview

      # ── Firebase Deploy ─────────────────────────────────────────────────
      - name: Install Firebase CLI
        if: steps.filter.outputs.frontend == 'true' || steps.filter.outputs.backend == 'true'
        run: npm install -g firebase-tools

      - name: Install uv
        if: steps.filter.outputs.backend == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Python environment for Firebase CLI
        if: steps.filter.outputs.backend == 'true'
        run: |
          uv export --format requirements-txt > requirements.txt
          uv venv venv
          uv pip install -r requirements.txt -p venv

      - name: Write Firebase service account
        if: steps.filter.outputs.backend == 'true'
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > firebase_admin.json

      - name: Write backend .env
        if: steps.filter.outputs.backend == 'true'
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "ENVIRONMENT=preview" >> .env

      - name: Deploy Functions (api_preview)
        if: steps.filter.outputs.backend == 'true'
        run: |
          firebase deploy \
            --project ${{ env.FIREBASE_PROJECT_ID }} \
            --only functions:api:api_preview \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --non-interactive \
            --force

      - name: Deploy to Firebase Hosting Preview Channel
        id: preview-deploy
        if: steps.filter.outputs.frontend == 'true'
        run: |
          set -e
          if ! firebase hosting:channel:deploy ${{ env.PREVIEW_CHANNEL }} --project ${{ env.FIREBASE_PROJECT_ID }} --token "${{ secrets.FIREBASE_TOKEN }}" --expires 7d --non-interactive > deploy.log 2>&1; then
            cat deploy.log
            echo "Firebase hosting deployment failed."
            exit 1
          fi
          cat deploy.log
          PREVIEW_URL=$(grep -oP 'Channel URL \(\K[^\)]+' deploy.log | head -1 || echo "https://anti-harassment-bot--dev-preview.web.app")
          echo "preview_url=${PREVIEW_URL}" >> $GITHUB_OUTPUT

      - name: Find open PRs targeting dev
        id: find-pr
        uses: actions/github-script@v7
        if: steps.filter.outputs.frontend == 'true' || steps.filter.outputs.backend == 'true'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'dev'
            });
            const pr = prs.data.find(p => p.head.sha === context.sha) || prs.data[0];
            return pr ? pr.number : null;

      - name: Comment preview URL on dev PR
        if: steps.find-pr.outputs.result != 'null' && (steps.filter.outputs.frontend == 'true' || steps.filter.outputs.backend == 'true')
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = ${{ steps.find-pr.outputs.result }};
            if (!prNumber) return;
            let body = `## 🔍 Preview Deployment (dev)\n\n`;
            if ('${{ steps.filter.outputs.frontend }}' === 'true') {
              const previewUrl = '${{ steps.preview-deploy.outputs.preview_url }}';
              body += `✅ 已部署至 Firebase Hosting Preview Channel\n🔗 **Preview URL**: ${previewUrl}\n`;
            }
            if ('${{ steps.filter.outputs.backend }}' === 'true') {
              body += `✅ Backend Updated\n📦 **Preview API**: \`https://asia-east1-anti-harassment-bot.cloudfunctions.net/api_preview\`\n`;
            }
            body += `⏳ **有效期限**: 7 天\n\n*由 GitHub Actions 自動部署*`;
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
