name: Deploy — Preview (dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      unit:
        description: Select one deployment unit or the full four-unit release
        required: true
        default: all
        type: choice
        options:
          - all
          - admin-backend
          - admin-frontend
          - client-backend
          - client-frontend

permissions:
  contents: read

concurrency:
  group: deploy-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Deploy selected units
    if: github.ref == 'refs/heads/dev'
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect affected services on push
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before }}
          filters: |
            client:
              - 'client/**'
            admin:
              - 'admin/**'
            shared:
              - 'shared/**'
              - 'scripts/**'
              - 'infrastructure/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'firebase*.json'
              - '.firebaserc'
              - '.firebaseignore'
              - '.github/workflows/**'
      - name: Select deployment units
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_UNIT: ${{ inputs.unit }}
          CLIENT_CHANGED: ${{ steps.filter.outputs.client }}
          ADMIN_CHANGED: ${{ steps.filter.outputs.admin }}
          SHARED_CHANGED: ${{ steps.filter.outputs.shared }}
        run: |
          set -euo pipefail
          admin_backend=false
          admin_frontend=false
          client_backend=false
          client_frontend=false
          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$SHARED_CHANGED" == "true" ]]; then
              admin_backend=true; admin_frontend=true; client_backend=true; client_frontend=true
            else
              if [[ "$ADMIN_CHANGED" == "true" ]]; then admin_backend=true; admin_frontend=true; fi
              if [[ "$CLIENT_CHANGED" == "true" ]]; then client_backend=true; client_frontend=true; fi
            fi
          else
            case "$REQUESTED_UNIT" in
              all) admin_backend=true; admin_frontend=true; client_backend=true; client_frontend=true ;;
              admin-backend) admin_backend=true ;;
              admin-frontend) admin_frontend=true ;;
              client-backend) client_backend=true ;;
              client-frontend) client_frontend=true ;;
              *) exit 2 ;;
            esac
          fi
          any=false
          if [[ "$admin_backend" == "true" || "$admin_frontend" == "true" || "$client_backend" == "true" || "$client_frontend" == "true" ]]; then any=true; fi
          for key in admin_backend admin_frontend client_backend client_frontend any; do
            echo "$key=${!key}" >> "$GITHUB_OUTPUT"
          done
      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.any == 'true'
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.any == 'true'
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v5
        if: steps.scope.outputs.any == 'true'
        with:
          version: "0.9.7"
      - name: Install deployment dependencies
        if: steps.scope.outputs.any == 'true'
        run: |
          uv python install 3.13
          uv sync --frozen --all-extras
          pnpm install --frozen-lockfile
          npm install --global firebase-tools@15.33.0
      - name: Authenticate with Workload Identity Federation
        if: steps.scope.outputs.any == 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: anti-harassment-bot
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        if: steps.scope.outputs.any == 'true'
      - name: Deploy Admin backend
        if: steps.scope.outputs.admin_backend == 'true'
        env:
          FIREBASE_SKIP_INFORMATIONAL_IAM: '1'
        run: uv run python scripts/deploy.py --environment preview --service admin --backend-only --output build/deployment-admin-backend.json
      - name: Deploy Admin frontend
        if: steps.scope.outputs.admin_frontend == 'true'
        run: uv run python scripts/deploy.py --environment preview --service admin --frontend-only --output build/deployment-admin-frontend.json
      - name: Deploy Client backend
        if: steps.scope.outputs.client_backend == 'true'
        env:
          FIREBASE_SKIP_INFORMATIONAL_IAM: '1'
          CHAT_APP_CHECK_ENABLED: ${{ vars.CLIENT_CHAT_APP_CHECK_ENABLED_DEV }}
        run: uv run python scripts/deploy.py --environment preview --service client --backend-only --output build/deployment-client-backend.json
      - name: Deploy Client frontend
        if: steps.scope.outputs.client_frontend == 'true'
        env:
          CLIENT_FIREBASE_APP_ID: ${{ vars.CLIENT_FIREBASE_APP_ID_DEV }}
          VITE_APP_CHECK_ENABLED: ${{ vars.CLIENT_APP_CHECK_ENABLED_DEV }}
          VITE_APP_CHECK_SITE_KEY: ${{ vars.CLIENT_APP_CHECK_SITE_KEY_DEV }}
        run: uv run python scripts/deploy.py --environment preview --service client --frontend-only --output build/deployment-client-frontend.json
      - name: Deployment summary
        if: steps.scope.outputs.any == 'true'
        run: |
          echo "Admin backend: ${{ steps.scope.outputs.admin_backend }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Admin frontend: ${{ steps.scope.outputs.admin_frontend }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Client backend: ${{ steps.scope.outputs.client_backend }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Client frontend: ${{ steps.scope.outputs.client_frontend }}" >> "$GITHUB_STEP_SUMMARY"
