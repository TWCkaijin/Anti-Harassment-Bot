name: Deploy — Preview (dev)

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: deploy-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Deploy affected services
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect affected services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.ref }}
          filters: |
            client:
              - 'client/**'
            admin:
              - 'admin/**'
            shared:
              - 'shared/**'
              - 'scripts/**'
              - 'infrastructure/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'firebase*.json'
              - '.firebaserc'
              - '.firebaseignore'
              - '.github/workflows/**'
      - name: Select deployment scope
        id: scope
        env:
          CLIENT_CHANGED: ${{ steps.filter.outputs.client }}
          ADMIN_CHANGED: ${{ steps.filter.outputs.admin }}
          SHARED_CHANGED: ${{ steps.filter.outputs.shared }}
        run: |
          if [[ "$SHARED_CHANGED" == true || ( "$CLIENT_CHANGED" == true && "$ADMIN_CHANGED" == true ) ]]; then
            echo 'service=all' >> "$GITHUB_OUTPUT"
          elif [[ "$CLIENT_CHANGED" == true ]]; then
            echo 'service=client' >> "$GITHUB_OUTPUT"
          elif [[ "$ADMIN_CHANGED" == true ]]; then
            echo 'service=admin' >> "$GITHUB_OUTPUT"
          else
            echo 'service=none' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.service != 'none'
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.service != 'none'
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v5
        if: steps.scope.outputs.service != 'none'
        with:
          version: "latest"
      - name: Install deployment dependencies
        if: steps.scope.outputs.service != 'none'
        run: |
          uv python install 3.13
          uv sync --frozen --all-extras
          pnpm install --frozen-lockfile
          npm install --global firebase-tools@15.33.0
      - name: Authenticate with Workload Identity Federation
        if: steps.scope.outputs.service != 'none'
        uses: google-github-actions/auth@v3
        with:
          project_id: anti-harassment-bot
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud CLI
        if: steps.scope.outputs.service != 'none'
        uses: google-github-actions/setup-gcloud@v3
      - name: Build and deploy functions before hosting
        if: steps.scope.outputs.service != 'none'
        env:
          DEPLOY_SERVICE: ${{ steps.scope.outputs.service }}
          # 15.33.0 probes legacy appspot actAs even for explicit runtime SAs.
          # Cloud APIs still enforce the resource-scoped deployment policy.
          FIREBASE_SKIP_INFORMATIONAL_IAM: "1"
          VITE_ANALYTICS_ENABLED: ${{ vars.ANALYTICS_ENABLED }}
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
        run: uv run python scripts/deploy.py --environment preview --service "$DEPLOY_SERVICE"
      - name: Deployment summary
        if: steps.scope.outputs.service != 'none'
        env:
          DEPLOY_SERVICE: ${{ steps.scope.outputs.service }}
        run: |
          echo "Deployed preview services: $DEPLOY_SERVICE" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview channels expire after 30 days; see deployment JSON output for exact URLs." >> "$GITHUB_STEP_SUMMARY"
