name: Deploy — Preview (dev)

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy-preview:
    name: Build & Deploy to Preview
    needs: quality-gate
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.filter.outputs.frontend }}
      backend_changed: ${{ steps.filter.outputs.backend }}
      preview_url: ${{ steps.preview-deploy.outputs.preview_url }}
    permissions:
      contents: read
    env:
      FUNCTIONS_REGION: asia-east1
      PREVIEW_CHANNEL: dev-preview

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'firebase.json'
              - '.firebaserc'
              - '.firebaseignore'
              - '.github/workflows/**'
            backend:
              - 'backend/**'
              - 'main.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'firebase.json'
              - '.firebaserc'
              - '.firebaseignore'
              - '.github/workflows/**'

      # ── Frontend Build ──────────────────────────────────────────────────
      - name: Setup pnpm
        if: steps.filter.outputs.frontend == 'true'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        if: steps.filter.outputs.frontend == 'true'
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend (preview)
        if: steps.filter.outputs.frontend == 'true'
        run: pnpm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://asia-east1-anti-harassment-bot.cloudfunctions.net/api_preview
          VITE_ENV: preview

      # ── Firebase Deploy ─────────────────────────────────────────────────
      - name: Install Firebase CLI
        if: steps.filter.outputs.frontend == 'true' || steps.filter.outputs.backend == 'true'
        run: npm install -g firebase-tools

      - name: Install uv
        if: steps.filter.outputs.backend == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Python environment for Firebase CLI
        if: steps.filter.outputs.backend == 'true'
        run: |
          uv export --format requirements-txt > requirements.txt
          uv venv venv
          uv pip install -r requirements.txt -p venv

      - name: Write Firebase service account
        if: steps.filter.outputs.backend == 'true'
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > firebase_admin.json

      - name: Write backend .env
        if: steps.filter.outputs.backend == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          RUNTIME_CONFIG_DOCUMENT_ID: app_dev
          ENVIRONMENT: preview
        run: |
          python - <<'PY'
          import json
          import os

          keys = [
              "OPENROUTER_API_KEY",
              "ADMIN_API_KEY",
              "RUNTIME_CONFIG_DOCUMENT_ID",
              "ENVIRONMENT",
          ]
          with open(".env", "w", encoding="utf-8") as env_file:
              for key in keys:
                  value = os.environ.get(key, "")
                  env_file.write(f"{key}={json.dumps(value, ensure_ascii=False)}\n")
          PY

      - name: Deploy Functions (api_preview)
        if: steps.filter.outputs.backend == 'true'
        run: |
          firebase deploy \
            --only functions:api:api_preview \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --non-interactive \
            --force

      - name: Deploy to Firebase Hosting Preview Channel
        id: preview-deploy
        if: steps.filter.outputs.frontend == 'true'
        run: |
          set -e
          if ! firebase hosting:channel:deploy ${{ env.PREVIEW_CHANNEL }} --token "${{ secrets.FIREBASE_TOKEN }}" --expires 30d --non-interactive > deploy.log 2>&1; then
            cat deploy.log
            echo "Firebase hosting deployment failed."
            exit 1
          fi
          cat deploy.log
          PREVIEW_URL=$(grep -oP 'Channel URL \(\K[^\)]+' deploy.log | head -1 || echo "https://anti-harassment-bot--dev-preview.web.app")
          echo "preview_url=${PREVIEW_URL}" >> $GITHUB_OUTPUT

  comment-preview:
    name: Comment Preview Result
    needs: deploy-preview
    if: >-
      needs.deploy-preview.outputs.frontend_changed == 'true' ||
      needs.deploy-preview.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Find open PRs targeting dev
        id: find-pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'dev'
            });
            const pr = prs.data.find(p => p.head.sha === context.sha) || prs.data[0];
            return pr ? pr.number : null;

      - name: Comment preview URL on dev PR
        if: steps.find-pr.outputs.result != 'null'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.find-pr.outputs.result }}
          FRONTEND_CHANGED: ${{ needs.deploy-preview.outputs.frontend_changed }}
          BACKEND_CHANGED: ${{ needs.deploy-preview.outputs.backend_changed }}
          PREVIEW_URL: ${{ needs.deploy-preview.outputs.preview_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) return;
            let body = `## 🔍 Preview Deployment (dev)\n\n`;
            if (process.env.FRONTEND_CHANGED === 'true') {
              const previewUrl = process.env.PREVIEW_URL;
              body += `✅ 已部署至 Firebase Hosting Preview Channel\n🔗 **Preview URL**: ${previewUrl}\n`;
            }
            if (process.env.BACKEND_CHANGED === 'true') {
              body += `✅ Backend Updated\n📦 **Preview API**: \`https://asia-east1-anti-harassment-bot.cloudfunctions.net/api_preview\`\n`;
            }
            body += `⏳ **有效期限**: 7 天\n\n*由 GitHub Actions 自動部署*`;
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
