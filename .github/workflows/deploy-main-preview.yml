name: Deploy — Main Hosting Preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main-hosting-preview
  cancel-in-progress: false

jobs:
  quality-gate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load project settings
        run: grep -E '^[A-Z_]+=' project.env >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Client App Check build settings
        shell: bash
        env:
          APP_CHECK_ENABLED: ${{ vars.CLIENT_APP_CHECK_ENABLED_PROD }}
          APP_CHECK_SITE_KEY: ${{ vars.CLIENT_APP_CHECK_SITE_KEY_PROD }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.CLIENT_FIREBASE_APP_ID_PROD }}
        run: |
          set -euo pipefail
          case "$APP_CHECK_ENABLED" in
            ''|true|false) ;;
            *) echo 'CLIENT_APP_CHECK_ENABLED_PROD must be true or false' >&2; exit 2 ;;
          esac
          if [[ "$APP_CHECK_ENABLED" == 'true' ]]; then
            if [[ -z "$APP_CHECK_SITE_KEY" || -z "$FIREBASE_API_KEY" || -z "$FIREBASE_PROJECT_ID" || -z "$FIREBASE_APP_ID" ]]; then
              echo 'Production Client Web App Check configuration is incomplete' >&2
              exit 2
            fi
          fi
      - name: Build main preview using the existing production API
        run: pnpm --filter @rag/client build
        env:
          VITE_API_BASE_URL: /api
          VITE_ENV: preview
          VITE_ANALYTICS_ENABLED: 'false'
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.CLIENT_FIREBASE_APP_ID_PROD }}
          VITE_APP_CHECK_ENABLED: ${{ vars.CLIENT_APP_CHECK_ENABLED_PROD }}
          VITE_APP_CHECK_SITE_KEY: ${{ vars.CLIENT_APP_CHECK_SITE_KEY_PROD }}
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.33.0
      - name: Deploy only the independent Hosting channel
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase hosting:channel:deploy main-preview \
            --project "$FIREBASE_PROJECT_ID" \
            --config firebase.main-preview.json \
            --expires 30d --non-interactive --json > main-preview-result.json
          node - <<'JS'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('main-preview-result.json', 'utf8'));
          if (result.status !== 'success') throw new Error('Hosting preview deployment failed');
          const urls = Object.values(result.result || {}).map(value => value.url).filter(Boolean);
          if (!urls.length) throw new Error('Deployment did not return a preview URL');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Main preview\n\nCommit: ${process.env.GITHUB_SHA}\n\n${urls.join('\n')}\n\nUses the existing production API through /api. Expires in 30 days.\n`);
          JS
