<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1220" viewBox="0 0 1080 1220" role="img" aria-label="03  後端聊天請求流程">
<title>03  後端聊天請求流程</title><desc>Firebase HTTP wrapper → Flask → Agent → 回覆契約</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#647c8c"/></marker></defs>
<rect width="100%" height="100%" rx="18" fill="#f7f9fc"/>
<g font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
<text x="34" y="42" font-size="24" font-weight="700" fill="#19394c">03  後端聊天請求流程</text>
<text x="34" y="72" font-size="14" fill="#617488">Firebase HTTP wrapper → Flask → Agent → 回覆契約</text>
<polyline points="385,192 385,230" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="385,312 385,350" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="250,432 250,455 208,455 208,485" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="520,432 520,455 562,455 562,485" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="208,565 208,590 385,590 385,620" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="562,565 562,590 385,590" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="385,685 385,725" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="385,807 385,860" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="385,935 385,980" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="385,1055 385,1110" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="715,271 790,300" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><polyline points="715,391 750,391 750,336 790,336" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><polyline points="715,766 790,766" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="752" y="744" text-anchor="middle" font-size="14" fill="#465e70" paint-order="stroke" stroke="#f7f9fc" stroke-width="6" stroke-linejoin="round">串流路徑</text><polyline points="715,894 752,894 752,946 790,946" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="55" y="110" width="660" height="82" rx="12" fill="#e6f4f1" stroke="#238575" stroke-width="1.6"/><text x="385.0" y="145.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">POST /v1/chat/ 或 /api/v1/chat/</text><text x="385.0" y="168.5" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">Firebase wrapper 保留 WSGI 串流與關閉回呼</text><rect x="55" y="230" width="660" height="82" rx="12" fill="#ffffff" stroke="#afbfcb" stroke-width="1.6"/><text x="385.0" y="265.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">API 邊界檢查</text><text x="385.0" y="288.5" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">請求大小、限流、依設定驗證 App Check</text><rect x="55" y="350" width="660" height="82" rx="12" fill="#ffffff" stroke="#afbfcb" stroke-width="1.6"/><text x="385.0" y="385.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">ChatRequest 與 Runtime Config</text><text x="385.0" y="408.5" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">文字／歷史／圖片驗證；維護模式與功能開關</text><rect x="55" y="485" width="305" height="80" rx="12" fill="#e6f4f1" stroke="#238575" stroke-width="1.6"/><text x="207.5" y="519.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">stream=true</text><text x="207.5" y="542.5" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">建立 SSE 回應</text><rect x="410" y="485" width="305" height="80" rx="12" fill="#eef2f7" stroke="#a0adbd" stroke-width="1.6"/><text x="562.5" y="519.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">stream=false</text><text x="562.5" y="542.5" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">一般 JSON 路徑</text><rect x="55" y="620" width="660" height="65" rx="12" fill="#ffffff" stroke="#afbfcb" stroke-width="1.6"/><text x="385.0" y="658.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">依設定遮蔽本輪文字與文字歷史</text><rect x="55" y="725" width="660" height="82" rx="12" fill="#e6f4f1" stroke="#238575" stroke-width="1.6"/><text x="385.0" y="760.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">OpenRouterAgent</text><text x="385.0" y="783.5" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">系統提示 + Skills + 歷史 + 模型／RAG</text><rect x="55" y="860" width="660" height="75" rx="12" fill="#ffffff" stroke="#afbfcb" stroke-width="1.6"/><text x="385.0" y="892.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">解析完整回答 JSON</text><text x="385.0" y="915.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">Pydantic 驗證結構與互動契約</text><rect x="55" y="980" width="660" height="75" rx="12" fill="#ffffff" stroke="#afbfcb" stroke-width="1.6"/><text x="385.0" y="1012.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">可信任動作解析</text><text x="385.0" y="1035.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">選取值匹配已啟用且本輪適用的 Skill 動作</text><rect x="55" y="1110" width="660" height="70" rx="12" fill="#e6f4f1" stroke="#238575" stroke-width="1.6"/><text x="385.0" y="1139.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">回傳 SSE done 或完整 JSON</text><text x="385.0" y="1162.5" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">回答、來源、引導、情緒與動作</text><rect x="790" y="270" width="245" height="92" rx="12" fill="#fff0ec" stroke="#bf7867" stroke-width="1.6"/><text x="912.5" y="310.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">串流前拒絕請求</text><text x="912.5" y="333.5" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">HTTP 狀態碼 + JSON</text><rect x="790" y="725" width="245" height="82" rx="12" fill="#e6f4f1" stroke="#238575" stroke-width="1.6"/><text x="912.5" y="760.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">串流預覽</text><text x="912.5" y="783.5" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">delta / guidance / progress</text><rect x="790" y="920" width="245" height="115" rx="12" fill="#fff0ec" stroke="#bf7867" stroke-width="1.6"/><text x="912.5" y="960.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">執行／格式錯誤</text><text x="912.5" y="983.5" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">串流前：HTTP 錯誤</text><text x="912.5" y="1006.5" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">串流後：error 事件</text><text x="790" y="1115" font-size="14" fill="#617488">CORS 另行處理跨來源規則</text><text x="790" y="1140" font-size="14" fill="#617488">不等同身分驗證</text></g></svg>