<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="550" viewBox="0 0 1080 550" role="img" aria-label="01  知識庫建立流程">
<title>01  知識庫建立流程</title><desc>離線匯入：原始文件 → 可搜尋的知識片段</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#647c8c"/></marker></defs>
<rect width="100%" height="100%" rx="18" fill="#f7f9fc"/>
<g font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
<text x="34" y="42" font-size="24" font-weight="700" fill="#19394c">01  知識庫建立流程</text>
<text x="34" y="72" font-size="14" fill="#617488">離線匯入：原始文件 → 可搜尋的知識片段</text>
<polyline points="340,155 385,155" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="690,155 735,155" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="887,200 887,265" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="735,310 690,310" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="385,310 340,310" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="188,355 188,420" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="690,463 735,463" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="35" y="110" width="305" height="90" rx="12" fill="#e6f4f1" stroke="#238575" stroke-width="1.6"/><text x="187.5" y="138.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">1. 收集來源</text><text x="187.5" y="161.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">法規／救濟 Markdown</text><text x="187.5" y="184.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">判決 CSV 或 Markdown</text><rect x="385" y="110" width="305" height="90" rx="12" fill="#ffffff" stroke="#afbfcb" stroke-width="1.6"/><text x="537.5" y="138.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">2. 解析與切分</text><text x="537.5" y="161.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">標題、來源 metadata</text><text x="537.5" y="184.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">目標 1600 字元／重疊 180</text><rect x="735" y="110" width="305" height="90" rx="12" fill="#ffffff" stroke="#afbfcb" stroke-width="1.6"/><text x="887.5" y="138.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">3. 補足片段脈絡</text><text x="887.5" y="161.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">標題／判決資料</text><text x="887.5" y="184.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">穩定 doc_id 與 chunk 資訊</text><rect x="735" y="265" width="305" height="90" rx="12" fill="#ffffff" stroke="#afbfcb" stroke-width="1.6"/><text x="887.5" y="304.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">4. 文件前綴</text><text x="887.5" y="327.5" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">passage: + 文字內容</text><rect x="385" y="265" width="305" height="90" rx="12" fill="#e6f4f1" stroke="#238575" stroke-width="1.6"/><text x="537.5" y="293.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">5. 建立 Embedding</text><text x="537.5" y="316.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">OpenRouter 預設路徑</text><text x="537.5" y="339.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">或選用本地模型</text><rect x="35" y="265" width="305" height="90" rx="12" fill="#ffffff" stroke="#afbfcb" stroke-width="1.6"/><text x="187.5" y="293.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">6. 寫入 Firestore</text><text x="187.5" y="316.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">content + metadata</text><text x="187.5" y="339.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">embedding 向量</text><rect x="35" y="420" width="655" height="85" rx="12" fill="#e6f4f1" stroke="#238575" stroke-width="1.6"/><text x="362.5" y="457.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">7. 三類 Collection</text><text x="362.5" y="480.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">rag_documents / rag_judgments / rag_remedies</text><rect x="735" y="420" width="305" height="85" rx="12" fill="#fff3d9" stroke="#c49b44" stroke-width="1.6"/><text x="887.5" y="457.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">8. 準備向量索引</text><text x="887.5" y="480.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">embedding 欄位與維度相符</text></g></svg>