<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1155" viewBox="0 0 1080 1155" role="img" aria-label="04  前端元件與執行流程">
<title>04  前端元件與執行流程</title><desc>持久會話與串流暫存分開；完成後才開放引導操作</desc>
