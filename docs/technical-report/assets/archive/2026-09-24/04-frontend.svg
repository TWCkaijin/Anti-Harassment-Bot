<rect width="100%" height="100%" rx="18" fill="#f7f9fc"/>
<g font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
<text x="34" y="42" font-size="24" font-weight="700" fill="#19394c">04  前端元件與執行流程</text>
<text x="34" y="72" font-size="14" fill="#617488">持久會話與串流暫存分開；完成後才開放引導操作</text>
