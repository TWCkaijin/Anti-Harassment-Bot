"round" marker-end="url(#arrow)" /><polyline points="840,1039 840,1105 790,1105" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="305" y="105" width="470" height="75" rx="12" fill="#e6f4f1" stroke="#238575" stroke-width="1.6"/><text x="540.0" y="137.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">App → useConversation</text><text x="540.0" y="160.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">載入 LocalStorage、Sidebar 與 ChatArea</text><rect x="305" y="220" width="470" height="75" rx="12" fill="#ffffff" stroke="#afbfcb" stroke-width="1.6"/><text x="540.0" y="252.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">ChatInput / 建議列 / 追問面板</text><text x="540.0" y="275.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">輸入文字或圖片 → 立即顯示使用者訊息</text><rect x="305" y="335" width="470" height="75" rx="12" fill="#ffffff" stroke="#afbfcb" stroke-width="1.6"/><text x="540.0" y="367.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">createChatRequest</text><text x="540.0" y="390.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">選取最近完整文字輪次並檢查預算</text><rect x="305" y="450" width="470" height="75" rx="12" fill="#e6f4f1" stroke="#238575" stroke-width="1.6"/><text x="540.0" y="482.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">sendChat：fetch POST</text><text x="540.0" y="505.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">stream=true + AbortController</text><rect x="305" y="562" width="470" height="62" rx="12" fill="#fff3d9" stroke="#c49b44" stroke-width="1.6"/><text x="540.0" y="599.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">SSE 解析：依事件更新狀態</text><rect x="30" y="683" width="220" height="92" rx="12" fill="#eef2f7" stroke="#a0adbd" stroke-width="1.6"/><text x="140.0" y="723.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">progress</text><text x="140.0" y="746.5" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">更新實際階段提示</text><rect x="290" y="683" width="235" height="92" rx="12" fill="#ffffff" stroke="#afbfcb" stroke-width="1.6"/><text x="407.5" y="712.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">delta / guidance</text><text x="407.5" y="735.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">更新暫存文字與預覽</text><text x="407.5" y="758.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">不寫入逐段內容</text><rect x="565" y="683" width="225" height="92" rx="12" fill="#e6f4f1" stroke="#238575" stroke-width="1.6"/><text x="677.5" y="712.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">done</text><text x="677.5" y="735.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">正式訊息與 metadata</text><text x="677.5" y="758.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">保存至 LocalStorage</text><rect x="830" y="683" width="225" height="92" rx="12" fill="#fff0ec" stroke="#bf7867" stroke-width="1.6"/><text x="942.5" y="712.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">error / 取消</text><text x="942.5" y="735.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">標示未完成</text><text x="942.5" y="758.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">移除未定稿選單</text><rect x="460" y="829" width="445" height="65" rx="12" fill="#fff3d9" stroke="#c49b44" stroke-width="1.6"/><text x="682.5" y="867.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">是否為 clarify 且有有效問題？</text><rect x="280" y="947" width="320" height="92" rx="12" fill="#e6f4f1" stroke="#238575" stroke-width="1.6"/><text x="440.0" y="976.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">answer：NextStepSuggestions</text><text x="440.0" y="999.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">水平建議＋一般輸入框</text><text x="440.0" y="1022.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">點選建議直接送出</text><rect x="680" y="947" width="320" height="92" rx="12" fill="#e6f4f1" stroke="#238575" stroke-width="1.6"/><text x="840.0" y="976.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">clarify：FollowUpPanel</text><text x="840.0" y="999.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">選項／其他 → 確認送出</text><text x="840.0" y="1022.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">可隱藏面板回到輸入框</text><rect x="460" y="1080" width="330" height="50" rx="12" fill="#ffffff" stroke="#afbfcb" stroke-width="1.6"/><text x="625.0" y="1111.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">下一輪獨立聊天請求</text><text x="34" y="872" font-size="15" fill="#617488">串流選項僅供預覽</text><text x="34" y="899" font-size="15" fill="#617488">done 後才可操作</text></g></svg>