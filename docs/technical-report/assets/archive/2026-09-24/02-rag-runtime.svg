roke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="843" y="568" text-anchor="middle" font-size="14" fill="#465e70" paint-order="stroke" stroke="#f7f9fc" stroke-width="6" stroke-linejoin="round">否</text><polyline points="388,728 388,765" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="388,830 388,867" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="720,797 755,797 755,845 790,845" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><polyline points="720,906 755,906 755,876 790,876" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><polyline points="388,945 388,982" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="388,1060 388,1080 540,1080 540,1100" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="910,728 1050,728 1050,1131 775,1131" fill="none" stroke="#647c8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="305" y="108" width="470" height="65" rx="12" fill="#e6f4f1" stroke="#238575" stroke-width="1.6"/><text x="540.0" y="146.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">已依設定遮蔽的本輪訊息與歷史</text><rect x="305" y="205" width="470" height="65" rx="12" fill="#fff3d9" stroke="#c49b44" stroke-width="1.6"/><text x="540.0" y="243.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">本輪訊息是否命中檢索關鍵詞？</text><rect x="50" y="317" width="280" height="75" rx="12" fill="#e6f4f1" stroke="#238575" stroke-width="1.6"/><text x="190.0" y="349.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">命中關鍵詞</text><text x="190.0" y="372.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">RAG 啟用／工具 required</text><rect x="400" y="317" width="280" height="75" rx="12" fill="#ffffff" stroke="#afbfcb" stroke-width="1.6"/><text x="540.0" y="349.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">未命中、use_rag=true</text><text x="540.0" y="372.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">工具 auto</text><rect x="750" y="317" width="280" height="75" rx="12" fill="#eef2f7" stroke="#a0adbd" stroke-width="1.6"/><text x="890.0" y="349.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">未命中、use_rag=false</text><text x="890.0" y="372.0" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">不提供工具</text><rect x="305" y="440" width="470" height="65" rx="12" fill="#ffffff" stroke="#afbfcb" stroke-width="1.6"/><text x="540.0" y="478.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">第一次模型請求：回答或 tool_calls</text><rect x="305" y="545" width="470" height="65" rx="12" fill="#fff3d9" stroke="#c49b44" stroke-width="1.6"/><text x="540.0" y="583.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">是否有工具呼叫？</text><rect x="55" y="650" width="665" height="78" rx="12" fill="#ffffff" stroke="#afbfcb" stroke-width="1.6"/><text x="387.5" y="683.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">驗證工具名與 query／data_type</text><text x="387.5" y="706.5" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">可選 harassment_type 加入查詢文字</text><rect x="790" y="650" width="240" height="78" rx="12" fill="#eef2f7" stroke="#a0adbd" stroke-width="1.6"/><text x="910.0" y="683.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">模型直接回答</text><text x="910.0" y="706.5" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">不執行資料檢索</text><rect x="55" y="765" width="665" height="65" rx="12" fill="#e6f4f1" stroke="#238575" stroke-width="1.6"/><text x="387.5" y="803.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">query: 前綴 → 查詢 Embedding</text><rect x="55" y="867" width="665" height="78" rx="12" fill="#ffffff" stroke="#afbfcb" stroke-width="1.6"/><text x="387.5" y="900.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">Firestore cosine 搜尋 → 合併 Top-k</text><text x="387.5" y="923.5" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">all 共用向量並行搜尋三類 Collection</text><rect x="790" y="818" width="240" height="80" rx="12" fill="#fff0ec" stroke="#bf7867" stroke-width="1.6"/><text x="910.0" y="852.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">Embedding／搜尋故障</text><text x="910.0" y="875.5" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">rag_unavailable</text><rect x="55" y="982" width="665" height="78" rx="12" fill="#ffffff" stroke="#afbfcb" stroke-width="1.6"/><text x="387.5" y="1015.5" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">檢索片段或「成功但查無資料」</text><text x="387.5" y="1038.5" text-anchor="middle" font-size="15" font-weight="400" fill="#23384a">以 tool 訊息送入第二次模型請求；不提供工具</text><rect x="305" y="1100" width="470" height="62" rx="12" fill="#e6f4f1" stroke="#238575" stroke-width="1.6"/><text x="540.0" y="1137.0" text-anchor="middle" font-size="17" font-weight="600" fill="#23384a">完整 JSON 驗證 → done／JSON 回覆</text></g></svg>