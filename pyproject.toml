[project]
name = "rag-harass-bot"
version = "0.1.0"
description = "性騷擾防治智能 AI — 後端服務"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.14.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "firebase-admin>=7.4.0",
    "firebase-functions>=0.5.0",
    "httpx>=0.28.1",
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
]

[project.optional-dependencies]
admin = ["openpyxl>=3.1.5", "argon2-cffi>=23.1", "google-cloud-tasks>=2.19", "pypdf>=6.20", "python-docx>=1.2"]

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.4.0", "ruff>=0.15.15"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["client/tests", "admin/tests", "shared/tests"]
addopts = "--import-mode=importlib"
pythonpath = [".", "shared/python", "client/backend", "admin/backend"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["rag_core", "client_app", "admin_app", "client", "admin", "shared"]
